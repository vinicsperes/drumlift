[project]
name = "drumlift"
version = "0.1.0"
description = "Isolate the drums of a song, generate a tab and play it back to check by ear."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "demucs>=4.1",
    "adtof-pytorch",
    "beat-this>=1.1",
    "torch>=2.11",
    "torchaudio>=2.11",
    "librosa>=0.11",
    "soundfile",
    "numpy",
    "pretty_midi",
]

[project.scripts]
drumlift = "drumlift.cli:main"

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch", rev = "85c192e" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drumlift*"]

[tool.setuptools.package-data]
drumlift = ["player/*", "player/app/*", "player/kit3d/*", "player/kit3d/moves/*", "player/vendor/*"]
